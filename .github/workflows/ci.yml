name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test

  e2e:
    name: End-to-end SDK install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart pub global activate --source path .
      - name: Install into a fresh SDK
        shell: bash
        run: |
          export DROIDKIT_HOME="$RUNNER_TEMP/droidkit"
          droidkit --yes --sdk-root "$RUNNER_TEMP/sdk" setup --no-emulator --no-persist-env --no-flutter-config
          droidkit --sdk-root "$RUNNER_TEMP/sdk" sdk list
          droidkit --sdk-root "$RUNNER_TEMP/sdk" doctor || true

  publish-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart pub publish --dry-run
